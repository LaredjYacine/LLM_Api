[project]
name = "llm-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lynix Dancho", email = "laredjyacine955@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "qwen-tokenizer>=0.3.0",
    "redis>=8.1.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
llm-api = "llm_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
